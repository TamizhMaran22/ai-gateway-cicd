apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  namespace: ai-gateway
data:
  PORT: "3000"
  NODE_ENV: "production"

---
# Optional: real provider keys go in a Secret, not the ConfigMap.
# Create with:
#   kubectl -n ai-gateway create secret generic ai-gateway-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-... \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=GOOGLE_API_KEY=...
# The app runs fine without this secret (falls back to simulated responses).

