# Use this if Prometheus was installed via the kube-prometheus-stack Helm
# chart (which runs the Prometheus Operator). If instead you're using a bare
# Prometheus deployment, use monitoring/prometheus-scrape-config.yaml below
# and skip this file - the two are alternatives, not both needed.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring --create-namespace

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    release: monitoring   # must match the label the operator watches for
spec:
  selector:
    matchLabels:
      app: ai-gateway
  namespaceSelector:
    matchNames:
      - ai-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

